<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#26306a"/>
      <stop offset="1" stop-color="#0a0e1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a6"/>
      <stop offset=".45" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#e07b12"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f7a"/>
      <stop offset="1" stop-color="#121634"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset=".35" stop-color="#a98bff"/>
      <stop offset=".7" stop-color="#ff8fc7"/>
      <stop offset="1" stop-color="#ffd35c"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset=".5" stop-color="#3b2e9c"/>
      <stop offset="1" stop-color="#1c1a5c"/>
    </linearGradient>
    <radialGradient id="burst" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffc83d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Escudo com borda dourada e filete ciano -->
  <path d="M256 30 L446 92 V250 C446 368 362 440 256 484 C150 440 66 368 66 250 V92 Z" fill="url(#gold)"/>
  <path d="M256 54 L424 108 V250 C424 354 350 418 256 458 C162 418 88 354 88 250 V108 Z" fill="url(#shield)"/>
  <path d="M256 54 L424 108 V250 C424 354 350 418 256 458 C162 418 88 354 88 250 V108 Z" fill="none" stroke="#5ee7ff" stroke-width="5" stroke-opacity=".85"/>
  <!-- Brilho da abertura do pacote -->
  <circle cx="256" cy="168" r="150" fill="url(#burst)"/>
  <!-- Cartas holográficas saindo do pacote -->
  <g transform="rotate(-22 256 260)">
    <rect x="150" y="118" width="108" height="150" rx="10" fill="url(#holo)" stroke="#fff1a6" stroke-width="6"/>
    <rect x="166" y="136" width="76" height="58" rx="4" fill="#ffffff" opacity=".35"/>
  </g>
  <g transform="rotate(20 256 260)">
    <rect x="256" y="112" width="108" height="150" rx="10" fill="url(#holo)" stroke="#fff1a6" stroke-width="6"/>
    <polyline points="272,212 294,192 312,204 336,170 350,178" fill="none" stroke="#0a0e1f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Pacote de booster com borda serrilhada -->
  <path d="M176 196 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 V392 C336 404 176 404 176 392 Z" fill="url(#pack)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M190 214 H322" stroke="#a98bff" stroke-width="4" opacity=".7"/>
  <!-- Z do Boosterz no pacote -->
  <path d="M212 252 H300 V276 L246 346 H302 V370 H208 V346 L262 276 H212 Z" fill="url(#gold)" stroke="#0a0e1f" stroke-width="6" stroke-linejoin="round"/>
  <!-- Faíscas -->
  <g fill="#fff6c9">
    <path d="M118 150 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z"/>
    <path d="M396 140 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z"/>
    <path d="M384 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#5ee7ff"/>
  </g>
</svg>
