<head>
<meta charset="utf-8">
<title>Boosterz</title>

<meta name="description" content="Escaneie, organize e acompanhe o valor da sua coleção de Pokémon TCG.">

<meta property="og:description" content="Escaneie suas cartas, acompanhe o valor da coleção e siga seus amigos.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boosterz">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css?v=202611051455">
<style>
/* Estilo mínimo da abertura, embutido: ela fica certa mesmo se styles.css ainda estiver carregando. */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: #080c1b; }
#splash .logo { width: min(84vw, 460px); height: auto; }
#splash .brand-lock { display: grid; justify-items: center; gap: 4px; }
#splash .beta { font: 700 12px/1 system-ui, sans-serif; letter-spacing: .28em; color: #3fd8ff; padding: 5px 9px 5px 12px; border: 1px solid rgb(63 216 255 / .5); border-radius: 999px; }
#splash .app-icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 0 0 2px rgb(63 216 255 / .5), 0 0 30px rgb(63 216 255 / .35); }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img class="app-icon" src="icons/icon-192.png" alt=""><span class="brand-lock"><img class="logo" src="icons/logo.webp" alt="Boosterz TCG Tracker"><span class="beta">BETA</span></span></div>
<script>setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 3000);</script>
<script>
/* O Boosterz mudou para boosterz.web.app. Quem abre o endereço antigo vai para o novo; quem usa sem conta
   e tem cartas salvas aqui vê antes um aviso para exportar o backup (os dados do navegador ficam presos a cada endereço). */
(function () {
  if (location.hostname !== 'pepequito.github.io') return;
  var next = 'https://boosterz.web.app/' + location.search + location.hash, s = {};
  try { s = JSON.parse(localStorage.getItem('fichario.v1') || '{}'); } catch (e) {}
  var localOnly = s.gate !== 'account' && s.cards && Object.keys(s.cards).length;
  if (!localOnly) { location.replace(next); return; }
  window.__movedTo = next;
})();
</script>
<header id="deskbar">
  <form id="deskSearch" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="deskQ" type="search" placeholder="Buscar cartas de qualquer coleção" aria-label="Buscar cartas" autocomplete="off"><kbd>/</kbd></form>
  <span class="drop-hint">Arraste a foto de uma carta para identificar</span>
  <button id="deskAvatar" class="ring-avatar" type="button" data-tab="profile" aria-label="Abrir perfil"></button>
</header>
<main id="view"></main>

<nav id="tabs" aria-label="Navegação principal">
  <div id="brand" class="desk-only brand-lock"><img class="logo" src="icons/logo.webp" alt="Boosterz TCG Tracker"><span class="beta">BETA</span></div>
  <button data-tab="home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3zM5 18a3 3 0 0 1 3-3h11"/></svg><span>Coleção</span></button>
  <button data-tab="cards" type="button" class="desk-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Minhas cartas</span></button>
  <button data-tab="sets" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Sets</span></button>
  <button id="scanBtn" type="button" aria-label="Escanear carta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/></svg><span class="scan-label">Escanear carta</span></button>
  <button data-tab="search" type="button" class="desk-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Explorar</span></button>
  <button data-tab="social" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.500 3.300-5.500 6.500-5.500s5.700 2 6.500 5.500"/><circle cx="17" cy="9" r="2.800"/><path d="M16 14.600c2.800-.3 4.800 1.400 5.500 4.400"/></svg><span>Social</span></button>
  <button data-tab="admin" type="button" class="desk-only admin-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.500 3.300 8 8 9 4.700-1 8-4.500 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Admin</span></button>
  <button data-tab="profile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.500-4 4.500-6 8-6s6.500 2 8 6"/></svg><span>Perfil</span></button>
  <div id="sideUser" class="desk-only"></div>
</nav>

<section id="scanner" hidden aria-label="Scanner de cartas">
  <video id="video" playsinline muted autoplay></video>
  <div class="shade"><div id="guide"><i></i><i></i><i></i><i></i></div></div>
  <div class="scan-top">
    <button id="scanClose" class="round" type="button" aria-label="Fechar scanner">✕</button>
    <button id="torch" class="round" type="button" aria-label="Ligar lanterna" hidden>⚡︎</button>
  </div>
  <p id="scanStatus" role="status">Abrindo a câmera…</p>
  <div class="scan-bottom">
    <label class="ghost" for="photoInput">Usar uma foto</label>
    <button class="ghost" type="button" data-report="scan">Não reconhece? Avise</button>
    <input id="photoInput" type="file" accept="image/*" hidden>
  </div>
</section>

<div id="sheetBack" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true"></section>
<div id="toast" role="status" hidden></div>
<input id="importInput" type="file" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script src="firebase-config.js?v=202611051455" defer></script>
<script src="app.js?v=202611051455" defer></script>
<script src="views.js?v=202611051455" defer></script>
<script src="desk.js?v=202611051455" defer></script>
<script src="sync.js?v=202611051455" defer></script>
<script src="access.js?v=202611051455" defer></script>
<script src="help.js?v=202611051455" defer></script>
<script src="social.js?v=202611051455" defer></script>
</body>
</html>
